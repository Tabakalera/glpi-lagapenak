openapi: 3.1.0
info:
  title: Lagapenak · API de integración G1 (Kide-Artean)
  version: 2.0.0-draft
  summary: Consulta de solo lectura de préstamos de material, con identificación seudonimizada del beneficiario.
  description: |
    Contrato funcional único para Lagapenak (plugin GLPI) y Kide-Artean. Cada proyecto lo implementa por
    separado.

    **Arquitectura.** Lagapenak es responsable de los préstamos, beneficiarios, material, entregas,
    devoluciones, incidencias y cancelaciones. La API es **de solo lectura**. Lagapenak no conoce residencias,
    cesiones ni personas de Kide-Artean: Kide-Artean identifica al beneficiario con las huellas que recibe
    (G1-ID01) y asocia el préstamo a una residencia o cesión por su cuenta.

    **Dos niveles.**
    - Nivel 1, descubrimiento (`GET /v1/loan-events`): qué préstamos han cambiado, con las huellas del
      beneficiario y el mínimo para decidir si hace falta el detalle (periodo y estado del material).
    - Nivel 2, detalle (`GET /v1/loans/{uuid}`, `GET /v1/loans?uuids=…`, `GET /v1/loans?number=…`): solo de
      los préstamos que Kide-Artean selecciona (coincidentes, en revisión o buscados por número).

    **Nunca se expone:** DNI/NIE ni email en claro, nombres de beneficiario, solicitante, firmante o
    supervisor, firmas, documentos, observaciones, campos libres, notas ni el texto del motivo de cancelación
    o de las incidencias. Validación del DPD pendiente: el mecanismo de huellas no está aprobado para producción.

    **Decisiones funcionales:** G1-ID01 (identificación), G1-F01 (devuelto con incidencia: cierre ordinario
    con aviso), G1-F02 (solicitado y no entregado: pendiente hasta cancelación), cancelación explícita en
    Lagapenak, histórico desde el 01/01/2026.

    **Compatibilidad:** GLPI 10.0.11 – 10.0.x y 11.0.x (probado en 10.0.20, 10.0.24 y 11.0.9). Sin sesión,
    cookie ni token CSRF de GLPI: en GLPI 11 la ruta se declara *stateless* en `plugin_lagapenak_boot()`; en
    GLPI 10 el script desactiva las cookies de sesión. La ruta se toma de `REQUEST_URI`.

    **Activación:** desactivada al instalar o actualizar; la activa un Super-Admin en
    *Configuración › Complementos › Lagapenak › Configurar*. Desactivada, todo responde 404.

  x-identification:
    rule: |
      G1-ID01, aplicada por Kide-Artean: 1) huella del email; 2) si no hay coincidencia inequívoca, huella del
      DNI/NIE; 3) si apuntan a personas distintas, discrepancia y revisión manual; 4) sin coincidencia,
      revisión manual; 5) pasaportes y documentos extranjeros: solo email. La API no decide coincidencias.
    normalization_g1_v1:
      email: Quitar espacios ASCII (espacio, tab, CR, LF, NUL, VT) al principio y al final; pasar A-Z a a-z (nada más); validar con la expresión EMAIL_RE de `PluginLagapenakBeneficiary` (solo ASCII, máx. 254); si no cumple, `invalid` y sin huella.
      tax_id: Pasar a-z a A-Z; quitar espacios ASCII, puntos, guiones, guiones bajos y barras. DNI = 1–8 cifras ASCII + letra, completado con ceros a 8 cifras. NIE = X/Y/Z + 1–7 cifras + letra, completado a 7 cifras (X=0, Y=1, Z=2 para el cálculo). Letra de control obligatoria y correcta (`TRWAGMYFPDXBNJZSQVHLCKE`, número módulo 23); si falta o no cuadra, `invalid`. Cualquier otro formato (pasaporte, documento extranjero) es `other` y no tiene huella.
      message: "lagapenak-g1|v1|<email|tax_id>|<valor normalizado>"
      output: HMAC-SHA256 en hexadecimal en minúsculas.
      vectors: docs/api/g1-hmac-vectors.json (generados con una implementación de referencia independiente en Python; la de PHP coincide en los 28 casos).
    keys: |
      Clave propia de la integración (32 bytes aleatorios), nunca una clave interna de Kide-Artean. La genera
      un Super-Admin en Lagapenak, se muestra una sola vez (kid + clave en base64) y se entrega a Kide-Artean
      por un canal seguro. Lagapenak la guarda cifrada con la clave de GLPI (GLPIKey, `secured_configs`);
      Kide-Artean, en su almacén de secretos. Cada huella lleva su `kid`.
      Rotación: se genera una clave nueva; la anterior queda en transición los días indicados (30 por
      defecto, máx. 90) y la API envía huellas con las dos. El cambio de claves vuelve a entregar todos los
      préstamos en el descubrimiento (su `changed_at` pasa a ser la fecha del cambio). Al terminar la
      transición, o con «Retirar», solo queda la nueva.
      Protección: las huellas y los identificadores no se escriben en el registro de la API (solo parámetros
      del contrato con su formato válido); las huellas son datos personales seudonimizados.

  x-state-matrix:
    description: |
      Estado del préstamo (`status`, el que calcula Lagapenak) y estado del material (`material_status`,
      calculado aquí a partir de las líneas). El cierre de residencia (lo decide Kide-Artean) debe usar
      `material_status`. Líneas: P = pendiente de entrega, E = entregada, D = devuelta, I = devuelta con incidencia.
    material_status:
      pending_delivery: Solicitado y no entregado. Sin líneas, o todas P. Interno - préstamo Pendiente (1). Cierre - bloquea (G1-F02).
      partially_delivered: Entregado parcialmente. Alguna P y alguna E/D/I. Interno - En curso (5). Cierre - bloquea.
      delivered: Material entregado. Todas E. Interno - Entregado (2). Cierre - bloquea.
      partially_returned: Pendiente de devolución. Alguna E y alguna D/I, ninguna P. Interno - Entregado (2). Cierre - bloquea.
      returned: Devuelto. Todas D. Interno - Devuelto (3). Cierre - permite.
      returned_with_incident: Devuelto con incidencia. Todas D/I y al menos una I. Interno - Devuelto (3). Cierre - permite con aviso (G1-F01).
      cancelled: Préstamo cancelado y ninguna línea E. Interno - Cancelado (4). Cierre - permite.
    special_cases:
      - Un préstamo histórico en estado Cancelado con alguna línea E devuelve `status = cancelled` y el `material_status` de sus líneas (material fuera). La cancelación nueva no lo permite.
      - "Borrado: evento `deleted` en el descubrimiento (con `material_status_at_deletion`), 410 en el detalle, `reason: deleted` en el lote."
      - "Fuera de las entidades autorizadas: evento `unavailable`, 404 en el detalle, `reason: not_available` en el lote."
      - "Sin respuesta, 5xx, 429, respuesta no JSON o paginación incompleta: no verificable (lo decide Kide-Artean)."

  x-sync:
    description: |
      - Alta inicial: `since=1970-01-01T00:00:00Z`, recorriendo páginas hasta `has_more = false`; guardar
        `next_since` solo tras procesar la página (si se interrumpe, se repite la página: idempotente).
      - Entran en el descubrimiento los préstamos de las entidades autorizadas que estuvieron o están activos
        desde `sync.from` (01/01/2026): fin previsto, inicio, alta, modificación o cancelación desde esa fecha,
        sin fin previsto, estado Pendiente/En curso/Entregado, alguna línea entregada o alguna línea cambiada
        desde esa fecha. Los anteriores siguen disponibles por número.
      - Un préstamo vuelve a aparecer cuando cambian el préstamo, sus líneas, la firma o la cancelación, las
        entidades autorizadas del cliente o las claves de identificación.
      - Orden total (`changed_at`, tipo, id) y cursor opaco: sin duplicados ni pérdidas al paginar. No se
        entregan cambios de los últimos `settle_seconds` (2 s) para no saltarse escrituras concurrentes.
      - Si `meta.client.scope_changed_at` es posterior a la última reconciliación, comprobar los préstamos
        conocidos con `GET /v1/loans?uuids=` (los que ya no están vuelven en `not_found`).
      - Recomendado: reconciliación periódica completa (p. ej. semanal) con el lote de UUID conocidos.
  contact:
    name: Tabakalera · Sistemas

servers:
  - url: https://{glpi}/plugins/lagapenak/front/api.php
    description: GLPI 10 y GLPI 11 (misma ruta).
    variables:
      glpi:
        default: glpi.example.invalid

security:
  - bearerToken: ['loans:read']

tags:
  - name: meta
  - name: discovery
  - name: detail

paths:
  /v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Estado de la API, del cliente, de las claves de identificación y de la sincronización
      security:
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/loan-events:
    get:
      tags: [discovery]
      operationId: listLoanEvents
      summary: Nivel 1 — descubrimiento incremental
      description: |
        Eventos ordenados desde el cursor: `upsert` (estado actual del préstamo, mínimo), `deleted` (borrado
        en GLPI) y `unavailable` (movido a una entidad no autorizada). Sin nombres, emails ni DNI.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: since
          in: query
          required: true
          description: '`next_since` de la respuesta anterior, o una fecha RFC 3339 (`1970-01-01T00:00:00Z` = desde el principio).'
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/loans:
    get:
      tags: [detail]
      operationId: listLoans
      summary: Nivel 2 — detalle por número o por lote de UUID
      description: |
        Exactamente uno de:
        - `number`: búsqueda de una persona (incorporación manual a la revisión). Cualquier fecha; solo
          entidades autorizadas. Exige `X-Acting-User`, que queda registrado. 0 o 1 resultado.
        - `uuids`: hasta 50 UUID separados por comas (préstamos seleccionados tras el descubrimiento o
          reconciliación). Los que no se devuelven aparecen en `not_found` con su motivo.
        Sin ninguno: 400 (no hay listado completo). No existe búsqueda por huella.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUser'
        - name: number
          in: query
          schema: { type: integer, minimum: 1 }
        - name: uuids
          in: query
          schema: { type: string, description: 'UUID separados por comas (máx. 50).' }
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanDetailPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/loans/{loan_uuid}:
    get:
      tags: [detail]
      operationId: getLoan
      summary: Nivel 2 — detalle de un préstamo
      description: 404 si no existe o está fuera de las entidades autorizadas (no se distingue); 410 si se borró en GLPI estando en una entidad autorizada.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUser'
        - name: loan_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Credencial de servidor a servidor emitida por un Super-Admin (`lgk_<8>_<40>`), mostrada una vez; se
        guarda su SHA-256. Caducidad máxima de 12 meses, rotación con gracia, revocación inmediata. Ámbito único
        `loans:read`. Entidades GLPI autorizadas (con o sin subentidades) comprobadas en cada petición. IP de
        origen permitidas. HTTPS obligatorio (desactivable solo en pruebas). Proxies de confianza para
        `X-Forwarded-For`/`X-Forwarded-Proto`. Límite por cliente y bloqueo de 5 min tras 20 credenciales
        fallidas desde una IP. Cualquier credencial no válida → el mismo 401.

  headers:
    RequestId:
      description: El `X-Request-Id` recibido o uno generado. Queda en el registro.
      schema: { type: string, maxLength: 64 }

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
    ActingUser:
      name: X-Acting-User
      in: header
      description: UUID opaco de la persona de Kide-Artean que origina la consulta (obligatorio con `number`). Solo para el registro.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  schemas:
    Period:
      type: object
      required: [start, end]
      properties:
        start: { type: [string, 'null'], format: date-time }
        end: { type: [string, 'null'], format: date-time }

    MaterialStatus:
      type: string
      description: Ver `x-state-matrix`.
      enum: [pending_delivery, partially_delivered, delivered, partially_returned, returned, returned_with_incident, cancelled]

    LoanStatus:
      type: string
      description: 'Estado interno de Lagapenak: Pendiente (1) → pending, En curso (5) → partially_delivered, Entregado (2) → delivered, Devuelto (3) → returned, Cancelado (4) → cancelled.'
      enum: [pending, partially_delivered, delivered, returned, cancelled]

    ItemStatus:
      type: string
      enum: [pending, delivered, returned, returned_with_incident]

    Fingerprint:
      type: object
      additionalProperties: false
      required: [kid, email, tax_id]
      properties:
        kid: { type: string, examples: ['g1-20261103-a1b2'] }
        email: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'Solo si `email_status = valid`.' }
        tax_id: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'Solo si `tax_id_status = valid` (DNI/NIE).' }

    Beneficiary:
      type: object
      additionalProperties: false
      description: Identificación seudonimizada. Nunca los valores.
      required: [email_status, tax_id_status, matches_requester_email, checked_on_entry, fingerprints]
      properties:
        email_status: { type: string, enum: [valid, missing, invalid] }
        tax_id_status:
          type: string
          enum: [valid, missing, invalid, other]
          description: '`other` = pasaporte u otro documento: no se usa para identificar (G1-ID01 punto 5).'
        matches_requester_email:
          type: boolean
          description: El email del beneficiario es uno de los del solicitante de GLPI (típico de préstamos antiguos autocompletados, o elegido a propósito).
        checked_on_entry:
          type: boolean
          description: El beneficiario se introdujo o corrigió con las reglas actuales (false en préstamos antiguos sin revisar).
        fingerprints:
          type: array
          description: Una entrada por clave en uso (dos durante una transición de clave). Vacío si no hay clave o ningún identificador válido.
          items: { $ref: '#/components/schemas/Fingerprint' }

    LoanEvent:
      type: object
      additionalProperties: false
      required: [event, loan_uuid, number, changed_at]
      properties:
        event: { type: string, enum: [upsert, deleted, unavailable] }
        loan_uuid: { type: string, format: uuid }
        number: { type: integer }
        changed_at: { type: string, format: date-time }
        period: { $ref: '#/components/schemas/Period', description: 'Solo en `upsert`.' }
        material_status: { $ref: '#/components/schemas/MaterialStatus', description: 'Solo en `upsert`.' }
        beneficiary: { $ref: '#/components/schemas/Beneficiary', description: 'Solo en `upsert`.' }
        material_status_at_deletion:
          description: Solo en `deleted`.
          oneOf:
            - $ref: '#/components/schemas/MaterialStatus'
            - type: 'null'

    LoanEventPage:
      type: object
      required: [data, next_since, has_more]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LoanEvent' } }
        next_since: { type: string, description: 'Cursor opaco para la siguiente llamada (también si `data` está vacío).' }
        has_more: { type: boolean }

    Loan:
      type: object
      additionalProperties: false
      required: [uuid, number, glpi_url, status, material_status, created_at, period, extension_request, delivery_note, cancellation, beneficiary, items_summary, items, changed_at]
      properties:
        uuid: { type: string, format: uuid }
        number: { type: integer, description: Número visible en GLPI. }
        glpi_url: { type: string, format: uri, description: 'Ficha en GLPI (requiere sesión y permisos en GLPI).' }
        status: { $ref: '#/components/schemas/LoanStatus' }
        material_status: { $ref: '#/components/schemas/MaterialStatus' }
        created_at: { type: [string, 'null'], format: date-time, description: Alta del préstamo. }
        period: { $ref: '#/components/schemas/Period', description: 'Periodo previsto (inicio y fin) del préstamo.' }
        extension_request:
          type: [object, 'null']
          description: Ampliación de fecha de fin pedida (sin el motivo).
          properties:
            status: { type: string, enum: [pending, rejected] }
            requested_end: { type: [string, 'null'], format: date-time }
        delivery_note:
          type: object
          required: [signed, signed_at]
          properties:
            signed: { type: boolean }
            signed_at: { type: [string, 'null'], format: date-time, description: 'Lo más cercano a la entrega efectiva: Lagapenak no guarda fechas reales de entrega ni de devolución.' }
        cancellation:
          type: [object, 'null']
          description: Solo si está cancelado. Sin el motivo ni quién canceló. `cancelled_at` es null en cancelaciones históricas sin registro.
          properties:
            cancelled_at: { type: [string, 'null'], format: date-time }
        beneficiary: { $ref: '#/components/schemas/Beneficiary' }
        items_summary:
          type: object
          required: [total, pending, delivered, returned, returned_with_incident]
          properties:
            total: { type: integer }
            pending: { type: integer }
            delivered: { type: integer }
            returned: { type: integer }
            returned_with_incident: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/LoanItem' }
        changed_at: { type: string, format: date-time, description: 'Fecha de modificación (versión) del préstamo para la API.' }

    LoanItem:
      type: object
      additionalProperties: false
      required: [type, name, inventory_number, status, period]
      properties:
        type: { type: string }
        name: { type: string }
        inventory_number: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ItemStatus' }
        period: { $ref: '#/components/schemas/Period', description: 'Periodo previsto de la línea.' }

    LoanDetailPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Loan' } }
        not_found:
          type: array
          description: Solo con `uuids`.
          items:
            type: object
            required: [uuid, reason, material_status_at_deletion]
            properties:
              uuid: { type: string, format: uuid }
              reason: { type: string, enum: [deleted, not_available] }
              material_status_at_deletion:
                oneOf:
                  - $ref: '#/components/schemas/MaterialStatus'
                  - type: 'null'

    Meta:
      type: object
      required: [api_version, plugin_version, glpi_version, server_time, client, identification, sync, limits]
      properties:
        api_version: { type: string }
        plugin_version: { type: string }
        glpi_version: { type: string }
        server_time: { type: string, format: date-time }
        client:
          type: object
          properties:
            name: { type: string }
            scopes: { type: array, items: { type: string, enum: ['loans:read'] } }
            expires_at: { type: string, format: date-time }
            token_rotation_pending: { type: boolean }
            scope_changed_at: { type: [string, 'null'], format: date-time }
        identification:
          type: object
          properties:
            algorithm: { type: string, examples: ['HMAC-SHA256'] }
            normalization: { type: string, examples: ['g1-v1'] }
            active_kid: { type: [string, 'null'] }
            keys:
              type: array
              items:
                type: object
                properties:
                  kid: { type: string }
                  state: { type: string, enum: [active, previous] }
                  retire_at: { type: [string, 'null'], format: date-time }
            keys_changed_at: { type: [string, 'null'], format: date-time }
        sync:
          type: object
          properties:
            from: { type: string, format: date }
            settle_seconds: { type: integer }
        limits:
          type: object
          properties:
            page_size_max: { type: integer }
            uuids_max: { type: integer }
            requests_per_minute: { type: integer }

    Problem:
      type: object
      description: RFC 9457 (`application/problem+json`). Nunca contiene datos personales ni valores recibidos.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, examples: ['urn:lagapenak:problem:not_found'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [invalid_request, unauthorized, forbidden_scope, ip_not_allowed, https_required, not_found, method_not_allowed, loan_deleted, rate_limited, internal_error]
        request_id: { type: string }

  responses:
    BadRequest:
      description: Parámetros inválidos o combinación no permitida (`invalid_request`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Credencial ausente, no válida, caducada o revocada (`unauthorized`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: '`forbidden_scope`, `ip_not_allowed` o `https_required`.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: No existe, fuera de las entidades autorizadas, ruta desconocida o API desactivada.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Gone:
      description: Préstamo borrado en GLPI (`loan_deleted`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: '`rate_limited`, con `Retry-After`.'
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
